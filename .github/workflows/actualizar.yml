name: Actualizar cronogramas

on:
  schedule:
    # Corre todos los días a las 08:00 hora de Perú (13:00 UTC).
    - cron: '0 13 * * *'
  workflow_dispatch: {}  # también se puede correr manualmente desde GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install feedparser requests beautifulsoup4 playwright

      - name: Instalar navegador headless (Chromium) para sitios dinámicos
        run: playwright install --with-deps chromium

      - name: Scrapear webs oficiales (fuente primaria)
        run: python scripts/scrapear_oficial.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Detectar novedades vía RSS (noticias)
        run: python scripts/detectar_rss.py

      - name: Extraer datos estructurados con IA desde noticias
        run: python scripts/extraer_ia.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Regenerar HTML desde el JSON
        run: python scripts/generar_html.py

      - name: Regenerar páginas individuales y sitemap
        run: python scripts/generar_paginas.py

      - name: Commitear y subir cambios directo a main
        run: |
          git config user.name "examenes-peru-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Actualización automática diaria de cronogramas y costos"
            git push
          fi